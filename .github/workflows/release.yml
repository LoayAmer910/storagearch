name: release

# Builds the Windows app on a clean machine, tests the packaged build, and attaches it to the GitHub release.
# Runs when a version tag (v1.2.3) is pushed. A tag with a suffix (v1.2.3-rc1) makes a draft release.
# "Run workflow" builds and tests the same way but publishes nothing - the EXE is kept as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write  # only to create the release and attach the EXE to it
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt pyinstaller==6.22.2

      - name: JPEG XL tools (libjxl v0.12.0, checked against a known hash)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "jxl.zip"
          Invoke-WebRequest "https://github.com/libjxl/libjxl/releases/download/v0.12.0/jxl-x64-windows-static.zip" -OutFile $zip
          $expected = "3025D7E308390796D20492322E606BC92DECAEE7B6BC99D3F7547870AE5DB7DE"
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "the JPEG XL download does not match the expected hash: $actual" }
          $out = Join-Path $env:RUNNER_TEMP "jxl"
          Expand-Archive $zip -DestinationPath $out
          New-Item -ItemType Directory tools -Force | Out-Null   # StorageArch.spec bundles what it finds in tools/
          foreach ($exe in "cjxl.exe", "djxl.exe") {
            Copy-Item (Get-ChildItem $out -Recurse -Filter $exe | Select-Object -First 1).FullName tools
          }
          & tools\cjxl.exe --version

      - name: Smoke
        run: python -m pytest tests/test_smoke.py -q -p no:cacheprovider

      - name: All tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Build the app
        run: python -m PyInstaller StorageArch.spec --noconfirm --clean

      - name: Build the packaged self-test
        shell: pwsh
        run: >
          python -m PyInstaller tests/packaging/selftest.py --noconfirm --onefile --console --name selftest
          "--paths=$PWD" --distpath build/selftest --workpath build/selftest_work --specpath build
          --collect-submodules core --collect-submodules local_cloud --hidden-import brotli --hidden-import send2trash
          --exclude-module PySide6 --exclude-module pytest
          "--add-binary=$PWD\tools\cjxl.exe;tools" "--add-binary=$PWD\tools\djxl.exe;tools"

      - name: Run the packaged self-test (archive, restore, compare, verify)
        shell: pwsh
        run: |
          & build\selftest\selftest.exe (Join-Path $env:RUNNER_TEMP "selftest")
          if ($LASTEXITCODE -ne 0) { throw "the packaged self-test failed" }

      - name: Start the app itself
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP "first_run"
          New-Item -ItemType Directory $home_dir | Out-Null
          $app = Start-Process (Resolve-Path dist\StorageArch.exe) -WorkingDirectory $home_dir -PassThru
          Start-Sleep -Seconds 25
          $app.Refresh()
          $alive = -not $app.HasExited
          $created = Test-Path (Join-Path $home_dir "SmartArchiveData\smartarchive.db")
          taskkill /PID $app.Id /T /F | Out-Null
          "still running: $alive, data folder created: $created"
          if (-not ($alive -and $created)) { throw "the packaged app did not start correctly" }
          exit 0

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\StorageArch.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  StorageArch.exe" | Out-File dist\StorageArch.exe.sha256 -Encoding ascii
          Get-Content dist\StorageArch.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: StorageArch-windows
          path: |
            dist/StorageArch.exe
            dist/StorageArch.exe.sha256
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = "dist/StorageArch.exe", "dist/StorageArch.exe.sha256"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } elseif ($tag.Contains("-")) {
            gh release create $tag $files --title "StorageArch $($tag.TrimStart('v'))" --notes-file .github/release_notes.md --draft
          } else {
            gh release create $tag $files --title "StorageArch $($tag.TrimStart('v'))" --notes-file .github/release_notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }
