name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: JPEG XL tools (libjxl v0.12.0)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "jxl.zip"
          Invoke-WebRequest "https://github.com/libjxl/libjxl/releases/download/v0.12.0/jxl-x64-windows-static.zip" -OutFile $zip
          $out = Join-Path $env:RUNNER_TEMP "jxl"
          Expand-Archive $zip -DestinationPath $out
          $tools = Join-Path $env:RUNNER_TEMP "jxl_tools"
          New-Item -ItemType Directory $tools | Out-Null
          foreach ($exe in "cjxl.exe", "djxl.exe") {
            Copy-Item (Get-ChildItem $out -Recurse -Filter $exe | Select-Object -First 1).FullName $tools
          }
          & (Join-Path $tools "cjxl.exe") --version
          "STORAGEARCH_JXL_TOOLS_DIR=$tools" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke
        run: python -m pytest tests_core/test_00_smoke.py -q -p no:cacheprovider

      - name: All tests
        run: python -m pytest tests_core -q -p no:cacheprovider --durations=10
