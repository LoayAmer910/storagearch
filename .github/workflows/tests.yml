name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: JPEG XL tools (libjxl v0.12.0, checked against a known hash)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "jxl.zip"
          Invoke-WebRequest "https://github.com/libjxl/libjxl/releases/download/v0.12.0/jxl-x64-windows-static.zip" -OutFile $zip
          $expected = "3025D7E308390796D20492322E606BC92DECAEE7B6BC99D3F7547870AE5DB7DE"
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "the JPEG XL download does not match the expected hash: $actual" }
          $out = Join-Path $env:RUNNER_TEMP "jxl"
          Expand-Archive $zip -DestinationPath $out
          $tools = Join-Path $env:RUNNER_TEMP "jxl_tools"
          New-Item -ItemType Directory $tools | Out-Null
          foreach ($exe in "cjxl.exe", "djxl.exe") {
            Copy-Item (Get-ChildItem $out -Recurse -Filter $exe | Select-Object -First 1).FullName $tools
          }
          & (Join-Path $tools "cjxl.exe") --version
          "STORAGEARCH_JXL_TOOLS_DIR=$tools" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke
        run: python -m pytest tests/test_smoke.py -q -p no:cacheprovider

      - name: All tests
        run: python -m pytest -q -p no:cacheprovider --durations=10
